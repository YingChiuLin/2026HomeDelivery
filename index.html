<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>崧鹿家 - 2026中秋預購</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Helvetica Neue', Arial, 'LiHei Pro', '微軟正黑體', sans-serif; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #fcf8f2; }
    ::-webkit-scrollbar-thumb { background: #fdba74; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #fb923c; }
  </style>
</head>
<body class="bg-[#fcf8f2]">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const IconUser = () => <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" width="20" height="20"><path strokeLinecap="round" strokeLinejoin="round" d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"></path></svg>;
    const IconCalendar = () => <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" width="20" height="20"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>;
    const IconCart = () => <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" width="20" height="20"><path strokeLinecap="round" strokeLinejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>;
    const IconMapPin = () => <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" width="20" height="20"><path strokeLinecap="round" strokeLinejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.242-4.243a8 8 0 1111.314 0z"></path><path strokeLinecap="round" strokeLinejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>;
    const IconCreditCard = () => <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" width="20" height="20"><path strokeLinecap="round" strokeLinejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>;
    const IconFileText = () => <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" width="20" height="20"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>;
    const IconInfo = () => <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" width="18" height="18"><path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>;
    const IconPlus = () => <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" width="16" height="16"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"></path></svg>;
    const IconMinus = () => <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" width="16" height="16"><path strokeLinecap="round" strokeLinejoin="round" d="M20 12H4"></path></svg>;
    const IconCheck = () => <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" width="64" height="64"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>;

    const PRODUCTS = [
      { id: 'box6', name: '6入禮盒', price: 330, desc: '精緻小巧，適合獨享', image: './images/6.jpg' },
      { id: 'box9', name: '9入禮盒', price: 480, desc: '經典包裝，送禮首選', image: './images/9.jpg' },
      { id: 'box12', name: '12入禮盒', price: 630, desc: '澎湃大方，家族共享', image: './images/12.jpg' },
    ];

    const BANK_INFO = { bankName: '玉山銀行 新湖分行', bankCode: '808', account: '1263-979-047173' };

    const generateValidDates = () => {
      const dates = [];
      const start = new Date(2026, 7, 18); 
      const end = new Date(2026, 8, 16);   
      for (let d = start; d <= end; d.setDate(d.getDate() + 1)) {
        const dayOfWeek = d.getDay();
        if (dayOfWeek !== 0 && dayOfWeek !== 1) { 
          const days = ['日', '一', '二', '三', '四', '五', '六'];
          dates.push(`${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')} (${days[dayOfWeek]})`);
        }
      }
      return dates;
    };
    const VALID_DATES = generateValidDates();

    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyDm3Y-dX6gaTxJUIgU2p_P-3-O7_fvQfdI3PvAR2IrlagUQrnGBikOvDqUt1Cb-IkNSA/exec';

    const calculateShipping = (totalBoxes) => {
      if (totalBoxes === 0) return 0;
      if (totalBoxes >= 1 && totalBoxes <= 2) return 130;
      if (totalBoxes >= 3 && totalBoxes <= 10) return 200;
      if (totalBoxes >= 11 && totalBoxes <= 19) return 250;
      return 0; 
    };

    function OrderForm() {
      const [customer, setCustomer] = useState({ name: '', phone: '09', phoneType: 'mobile', email: '' });
      const [recipient, setRecipient] = useState({ name: '', phone: '09', phoneType: 'mobile', address: '' });
      const [sameAsCustomer, setSameAsCustomer] = useState(false);
      const [selectedDate, setSelectedDate] = useState('');
      
      const [cart, setCart] = useState({ box6: 0, box9: 0, box12: 0 });
      const [remainingStock, setRemainingStock] = useState(null); 
      const [isFetchingStock, setIsFetchingStock] = useState(false);
      const [stockWarning, setStockWarning] = useState('');
      
      const [modalMessage, setModalMessage] = useState(''); // 自定義提示框訊息
      
      const [paymentMethod, setPaymentMethod] = useState('transfer'); 
      const [payment, setPayment] = useState({ date: '', last5: '' });
      const [notes, setNotes] = useState('');

      const [isSubmitted, setIsSubmitted] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [submitError, setSubmitError] = useState('');

      useEffect(() => {
        if (!selectedDate) {
          setRemainingStock(null);
          setCart({ box6: 0, box9: 0, box12: 0 });
          return;
        }
        const fetchStock = async () => {
          setIsFetchingStock(true);
          setStockWarning('');
          try {
            const response = await fetch(`${GOOGLE_SCRIPT_URL}?date=${encodeURIComponent(selectedDate)}`);
            const data = await response.json();
            if (data && typeof data.remainingPieces !== 'undefined') {
              setRemainingStock(data.remainingPieces);
              setCart({ box6: 0, box9: 0, box12: 0 }); 
            }
          } catch (error) {
            console.error('Fetch stock error:', error);
          } finally {
            setIsFetchingStock(false);
          }
        };
        fetchStock();
      }, [selectedDate]);

      useEffect(() => {
        if (sameAsCustomer) {
          setRecipient(prev => ({ ...prev, name: customer.name, phone: customer.phone, phoneType: customer.phoneType }));
        } else {
          setRecipient({ name: '', phone: '09', phoneType: 'mobile', address: '' });
        }
      }, [sameAsCustomer, customer.name, customer.phone, customer.phoneType]);

      const orderSummary = useMemo(() => {
        let totalBoxes = 0;
        let subtotal = 0;
        PRODUCTS.forEach(p => {
          const qty = cart[p.id];
          totalBoxes += qty;
          subtotal += (qty * p.price);
        });
        const shippingFee = calculateShipping(totalBoxes);
        return { totalBoxes, subtotal, shippingFee, total: subtotal + shippingFee };
      }, [cart]);

      const handleQuantityChange = (id, delta) => {
        if (!selectedDate) {
          setStockWarning('💡 貼心提醒：請先選擇「出貨日期」，才能選擇數量喔！');
          return;
        }
        setStockWarning(''); 
        
        setCart(prev => {
          const current = prev[id];
          const next = current + delta;
          if (next < 0) return prev;

          if (delta > 0 && remainingStock !== null) {
            let pieceCount = 0;
            if (id === 'box6') pieceCount = 6;
            if (id === 'box9') pieceCount = 9;
            if (id === 'box12') pieceCount = 12;

            const currentTotalPieces = (prev.box6 * 6) + (prev.box9 * 9) + (prev.box12 * 12);
            
            if (currentTotalPieces + pieceCount > remainingStock) {
              const msg = `⚠️ 抱歉，已達 ${selectedDate} 的訂購總數上限，請調整數量，謝謝！`;
              setStockWarning(msg);
              setModalMessage(msg); // 觸發彈出提示框
              return prev; 
            }
          }
          return { ...prev, [id]: next };
        });
      };

      const handleDisabledPlusClick = (productName) => {
        if (!selectedDate) {
          setModalMessage('💡 貼心提醒：請先選擇「出貨日期」，才能開始選購商品喔！');
        } else {
          setModalMessage(`⚠️ 抱歉，已達 ${selectedDate} 的訂購總數上限，請調整數量，謝謝！`);
        }
      };

      const handlePhoneInput = (setter, phoneType) => (e) => {
        const { name, value } = e.target;
        
        if (name === 'phoneType') {
            if (value === 'mobile') {
                setter(prev => ({ ...prev, phoneType: value, phone: '09' }));
            } else {
                setter(prev => ({ ...prev, phoneType: value, phone: '' }));
            }
            return;
        }

        if (name === 'phone' && phoneType === 'mobile') {
            let val = value.replace(/\D/g, '');
            if (val.length < 2) {
                val = '09';
            } else if (!val.startsWith('09')) {
                val = '09' + val.substring(2);
            }
            if (val.length > 10) val = val.slice(0, 10);
            
            let formatted = val;
            if (val.length > 7) {
                formatted = val.slice(0, 4) + '-' + val.slice(4, 7) + '-' + val.slice(7);
            } else if (val.length > 4) {
                formatted = val.slice(0, 4) + '-' + val.slice(4);
            }
            setter(prev => ({ ...prev, phone: formatted }));
        } else if (name === 'phone' && phoneType === 'landline') {
            setter(prev => ({ ...prev, phone: value.replace(/[^\d-]/g, '') }));
        } else {
            setter(prev => ({ ...prev, [name]: value }));
        }
      };

      const handleInputChange = (setter) => (e) => {
        const { name, value } = e.target;
        setter(prev => ({ ...prev, [name]: value }));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSubmitError('');

        if (!selectedDate) { setSubmitError('請選擇出貨日期'); return; }
        if (orderSummary.totalBoxes === 0) { setSubmitError('請至少選擇一項商品'); return; }
        
        if (customer.phoneType === 'mobile') {
            const rawPhone = customer.phone.replace(/\D/g, '');
            if (rawPhone.length !== 10 || !rawPhone.startsWith('09')) {
                 setSubmitError('訂購人手機號碼格式錯誤 (需為09開頭共10碼)');
                 return;
            }
        }
        
        if (recipient.phoneType === 'mobile') {
            const rawPhone = recipient.phone.replace(/\D/g, '');
            if (rawPhone.length !== 10 || !rawPhone.startsWith('09')) {
                 setSubmitError('收件人手機號碼格式錯誤 (需為09開頭共10碼)');
                 return;
            }
        }

        setIsSubmitting(true);

        const payload = {
          customerName: customer.name, customerPhone: customer.phone, customerEmail: customer.email,
          selectedDate, box6: cart.box6, box9: cart.box9, box12: cart.box12,
          totalBoxes: orderSummary.totalBoxes, subtotal: orderSummary.subtotal,
          shippingFee: orderSummary.shippingFee, total: orderSummary.total,
          recipientName: recipient.name, recipientPhone: recipient.phone, recipientAddress: recipient.address,
          paymentMethod, paymentDate: payment.date,
          paymentLast5: paymentMethod === 'transfer' ? payment.last5 : '', notes
        };

        try {
          const response = await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload),
            redirect: 'follow'
          });
          const result = await response.json();
          if (result.result === 'success') {
            setIsSubmitted(true);
          } else {
            setSubmitError(result.message || '發生未知錯誤');
          }
        } catch (error) {
          setSubmitError('無法連線至伺服器。請檢查網路連線或稍後再試。');
        } finally {
          setIsSubmitting(false);
        }
      };

      if (isSubmitted) {
        return (
          <div className="min-h-screen bg-orange-50 flex items-center justify-center p-4">
            <div className="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full text-center">
              <div className="text-green-500 flex justify-center mb-4"><IconCheck /></div>
              <h2 className="text-2xl font-bold text-gray-800 mb-2">訂單已送出！</h2>
              <p className="text-gray-600 mb-6">感謝您的預購，我們已收到您的宅配訂單資訊。</p>
              <button onClick={() => window.location.reload()} className="bg-orange-500 text-white px-6 py-2 rounded-full font-medium hover:bg-orange-600">返回首頁</button>
            </div>
          </div>
        );
      }

      return (
        <div className="pb-20">
          {/* 自定義提示彈出框 (Message Box) */}
          {modalMessage && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
              <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 text-center transform transition-all">
                <div className="w-12 h-12 bg-orange-100 text-orange-500 rounded-full flex items-center justify-center mx-auto mb-4">
                  <IconInfo />
                </div>
                <h3 className="text-lg font-bold text-gray-800 mb-2">系統提醒</h3>
                <p className="text-gray-600 text-sm mb-6 leading-relaxed">{modalMessage}</p>
                <button 
                  onClick={() => setModalMessage('')} 
                  className="w-full bg-orange-500 text-white font-bold py-3 rounded-xl hover:bg-orange-600 transition-colors"
                >
                  我知道了
                </button>
              </div>
            </div>
          )}

          <header className="bg-orange-500 text-white py-6 shadow-md rounded-b-[2rem]">
            <div className="max-w-2xl mx-auto px-4 text-center">
              <h1 className="text-3xl font-bold tracking-widest mb-1">崧鹿家</h1>
              <p className="text-white text-xl md:text-2xl font-bold tracking-wide mt-2 drop-shadow-sm">2026中秋預購 - 島鹽蛋黃酥 (宅配專區)</p>
            </div>
          </header>

          <main className="max-w-2xl mx-auto px-4 py-8 space-y-6">
            <form onSubmit={handleSubmit} className="space-y-8">
              
              {}
              <section className="bg-white p-6 rounded-2xl shadow-sm border border-orange-100">
                <div className="flex items-center gap-2 mb-4 text-orange-600">
                  <IconUser /> <h2 className="text-lg font-bold">訂購人資訊</h2>
                </div>
                <div className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">姓名 <span className="text-red-500">*</span></label>
                    <input required type="text" name="name" value={customer.name} onChange={handleInputChange(setCustomer)} className="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-400 outline-none" placeholder="請輸入姓名" />
                  </div>
                  <div className="grid grid-cols-[100px_1fr] gap-3">
                      <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">類型</label>
                          <select name="phoneType" value={customer.phoneType} onChange={handlePhoneInput(setCustomer, customer.phoneType)} className="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-400 outline-none bg-white">
                              <option value="mobile">手機</option>
                              <option value="landline">市話</option>
                          </select>
                      </div>
                      <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">電話 <span className="text-red-500">*</span></label>
                          <input 
                            required 
                            type="tel" 
                            name="phone" 
                            value={customer.phone} 
                            onChange={handlePhoneInput(setCustomer, customer.phoneType)} 
                            className="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-400 outline-none" 
                            placeholder={customer.phoneType === 'mobile' ? '09xx-xxx-xxx' : '02-12345678'} 
                          />
                      </div>
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Email <span className="text-gray-400 text-xs font-normal">(選填)</span></label>
                    <input type="email" name="email" value={customer.email} onChange={handleInputChange(setCustomer)} className="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-400 outline-none" placeholder="example@email.com" />
                  </div>
                </div>
              </section>

              {}
              <section className="bg-white p-6 rounded-2xl shadow-sm border border-orange-100">
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center gap-2 text-orange-600"><IconCalendar /> <h2 className="text-lg font-bold">選擇出貨日期 <span className="text-red-500">*</span></h2></div>
                  {isFetchingStock && <span className="text-orange-500 text-sm font-medium animate-pulse flex items-center gap-1"><span className="w-2 h-2 bg-orange-500 rounded-full animate-ping"></span> 查詢中...</span>}
                </div>
                <p className="text-xs text-gray-500 mb-3 bg-orange-50 p-2 rounded-lg inline-block">* 宅配期間：8/18 - 9/16 (每週日、一不出貨)</p>
                <select required value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} className="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-400 bg-white">
                  <option value="" disabled>請選擇日期...</option>
                  {VALID_DATES.map(date => <option key={date} value={date}>{date}</option>)}
                </select>
              </section>

              {}
              <section className="bg-white p-6 rounded-2xl shadow-sm border border-orange-100">
                <div className="flex items-center gap-2 mb-4 text-orange-600"><IconCart /> <h2 className="text-lg font-bold">選擇品項數量</h2></div>
                {stockWarning && <div className="mb-4 bg-red-50 text-red-600 p-3 rounded-xl border border-red-200 text-sm font-medium flex items-start gap-2"><div className="mt-0.5"><IconInfo /></div> <span>{stockWarning}</span></div>}
                
                <div className="space-y-4">
                  {PRODUCTS.map(product => {
                    let pieceCount = product.id === 'box6' ? 6 : product.id === 'box9' ? 9 : 12;
                    const currentTotalPieces = (cart.box6 * 6) + (cart.box9 * 9) + (cart.box12 * 12);
                    const willExceed = remainingStock !== null && (currentTotalPieces + pieceCount > remainingStock);
                    const isSoldOut = remainingStock !== null && remainingStock < 6; 
                    const isDateNotSelected = !selectedDate;
                    const isDisabled = willExceed || isDateNotSelected || isSoldOut || isFetchingStock;
                    
                    return (
                      <div key={product.id} className={`flex items-center justify-between p-4 border rounded-xl transition-colors ${isSoldOut ? 'bg-gray-50 border-gray-200 opacity-70' : 'border-gray-100 hover:border-orange-200 bg-[#fdfbf7]'}`}>
                        <div className="flex gap-4 items-center">
                          <div className="w-20 h-20 flex-shrink-0 rounded-lg overflow-hidden border border-orange-100 bg-white relative">
                            <img src={product.image} alt={product.name} className={`w-full h-full object-cover ${isSoldOut ? 'grayscale' : ''}`} onError={(e) => { e.target.src = `https://placehold.co/100x100/FFF3E0/E65100?text=${product.name.split('入')[0]}%E5%85%A5`; }}/>
                            {isSoldOut && <div className="absolute inset-0 bg-gray-900/60 flex items-center justify-center text-white text-xs font-bold tracking-widest">今日售完</div>}
                          </div>
                          <div>
                            <h3 className="font-bold text-gray-800">{product.name}</h3>
                            <p className="text-sm text-gray-500">{product.desc}</p>
                            <p className="font-semibold text-orange-600 mt-1">NT$ {product.price}</p>
                          </div>
                        </div>
                        <div className="flex items-center gap-3 bg-white rounded-full p-1 shadow-sm border border-gray-100">
                          <button type="button" onClick={() => handleQuantityChange(product.id, -1)} className="w-8 h-8 flex items-center justify-center rounded-full bg-gray-50 text-gray-600 hover:bg-orange-100 hover:text-orange-600 disabled:opacity-30" disabled={cart[product.id] === 0 || isDateNotSelected}><IconMinus /></button>
                          <span className="w-6 text-center font-bold text-gray-800">{cart[product.id]}</span>
                          
                          {/* 加號按鈕：如果禁用，點擊時會觸發彈出提示說明 */}
                          {isDisabled ? (
                            <div onClick={() => handleDisabledPlusClick(product.name)} className="cursor-pointer">
                              <button type="button" className="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 text-gray-300 pointer-events-none" disabled><IconPlus /></button>
                            </div>
                          ) : (
                            <button type="button" onClick={() => handleQuantityChange(product.id, 1)} className="w-8 h-8 flex items-center justify-center rounded-full bg-gray-50 text-gray-600 hover:bg-orange-100 hover:text-orange-600"><IconPlus /></button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </section>

              {}
              <section className="bg-white p-6 rounded-2xl shadow-sm border border-orange-100">
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center gap-2 text-orange-600"><IconMapPin /> <h2 className="text-lg font-bold">收件人資訊</h2></div>
                  <label className="flex items-center gap-2 text-sm cursor-pointer hover:bg-orange-50 px-2 py-1 rounded-md">
                    <input type="checkbox" checked={sameAsCustomer} onChange={(e) => setSameAsCustomer(e.target.checked)} className="w-4 h-4 text-orange-500 rounded border-gray-300"/> <span className="text-gray-600">同訂購人</span>
                  </label>
                </div>
                <div className="space-y-4">
                  <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">姓名 <span className="text-red-500">*</span></label>
                      <input required type="text" name="name" value={recipient.name} onChange={handleInputChange(setRecipient)} className="w-full p-3 border border-gray-200 rounded-xl outline-none bg-gray-50/50" disabled={sameAsCustomer} />
                  </div>
                  <div className="grid grid-cols-[100px_1fr] gap-3">
                      <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">類型</label>
                          <select name="phoneType" value={recipient.phoneType} onChange={handlePhoneInput(setRecipient, recipient.phoneType)} className="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-400 outline-none bg-white" disabled={sameAsCustomer}>
                              <option value="mobile">手機</option>
                              <option value="landline">市話</option>
                          </select>
                      </div>
                      <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">電話 <span className="text-red-500">*</span></label>
                          <input 
                            required 
                            type="tel" 
                            name="phone" 
                            value={recipient.phone} 
                            onChange={handlePhoneInput(setRecipient, recipient.phoneType)} 
                            className="w-full p-3 border border-gray-200 rounded-xl outline-none bg-gray-50/50" 
                            placeholder={recipient.phoneType === 'mobile' ? '09xx-xxx-xxx' : '02-12345678'} 
                            disabled={sameAsCustomer} 
                          />
                      </div>
                  </div>
                  <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">地址 <span className="text-red-500">*</span></label>
                      <input required type="text" name="address" value={recipient.address} onChange={handleInputChange(setRecipient)} className="w-full p-3 border border-gray-200 rounded-xl outline-none" />
                  </div>
                </div>
              </section>

              {}
              <div className="bg-orange-50 border border-orange-200 rounded-xl p-4 flex gap-3 text-sm text-gray-700">
                <div className="text-orange-500 mt-0.5"><IconInfo /></div>
                <div>
                  <p className="font-bold text-orange-800 mb-1">黑貓宅急便 運費說明</p>
                  <ul className="list-disc list-inside space-y-0.5 ml-1">
                    <li>1 ~ 2 盒：運費 130 元</li><li>3 ~ 10 盒：運費 200 元</li><li>11 ~ 19 盒：運費 250 元</li><li className="font-semibold text-red-500">20盒以上免運優惠！</li>
                  </ul>
                </div>
              </div>

              <section className="bg-white p-6 rounded-2xl shadow-sm border border-orange-100">
                <div className="flex items-center gap-2 mb-4 text-orange-600"><IconCreditCard /> <h2 className="text-lg font-bold">付款方式</h2></div>
                <div className="flex gap-4 mb-6">
                  <label className={`flex-1 flex items-center justify-center gap-2 p-3 rounded-xl border-2 cursor-pointer transition-all ${paymentMethod === 'transfer' ? 'border-orange-500 bg-orange-50 text-orange-700 font-bold' : 'border-gray-200 text-gray-500'}`}><input type="radio" name="paymentMethod" value="transfer" checked={paymentMethod === 'transfer'} onChange={(e) => setPaymentMethod(e.target.value)} className="hidden" />匯款</label>
                  <label className={`flex-1 flex items-center justify-center gap-2 p-3 rounded-xl border-2 cursor-pointer transition-all ${paymentMethod === 'cash' ? 'border-orange-500 bg-orange-50 text-orange-700 font-bold' : 'border-gray-200 text-gray-500'}`}><input type="radio" name="paymentMethod" value="cash" checked={paymentMethod === 'cash'} onChange={(e) => setPaymentMethod(e.target.value)} className="hidden" />到店付現</label>
                </div>
                
                {paymentMethod === 'transfer' && (
                  <div>
                    <div className="bg-gray-50 p-4 rounded-xl border border-gray-200 mb-4 font-mono text-sm">
                      <p>銀行代碼：<span className="font-bold text-lg">{BANK_INFO.bankCode}</span></p>
                      <p>銀行名稱：{BANK_INFO.bankName}</p>
                      <p>帳號：<span className="font-bold text-lg text-orange-600">{BANK_INFO.account}</span></p>
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                      <div><label className="block text-sm font-medium mb-1">預計匯款日 <span className="text-red-500">*</span></label><input required type="date" name="date" value={payment.date} onChange={handleInputChange(setPayment)} className="w-full p-3 border border-gray-200 rounded-xl outline-none" /></div>
                      <div><label className="block text-sm font-medium mb-1">帳號後五碼 <span className="text-red-500">*</span></label><input required type="text" maxLength={5} name="last5" value={payment.last5} onChange={handleInputChange(setPayment)} className="w-full p-3 border border-gray-200 rounded-xl outline-none" placeholder="12345" /></div>
                    </div>
                  </div>
                )}
                
                {paymentMethod === 'cash' && (
                  <div className="space-y-4">
                      <div className="text-sm bg-orange-50 p-4 rounded-xl border border-orange-100 flex items-start gap-2">
                          <div className="text-orange-500 mt-0.5"><IconInfo /></div>
                          <p>請於約定時間內至店面完成付款，始完成訂單確認。</p>
                      </div>
                      <div>
                          <label className="block text-sm font-medium mb-1">預計到店付款日 <span className="text-red-500">*</span></label>
                          <input required type="date" name="date" value={payment.date} onChange={handleInputChange(setPayment)} className="w-full p-3 border border-gray-200 rounded-xl outline-none" />
                      </div>
                  </div>
                )}
              </section>

              {}
              <section className="bg-white p-6 rounded-2xl shadow-sm border border-orange-100">
                <div className="flex items-center gap-2 mb-4 text-orange-600"><IconFileText /> <h2 className="text-lg font-bold">備註留言</h2></div>
                <textarea value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="如有特殊需求，或需要收據、統編、抬頭，請在此填寫" className="w-full p-3 border border-gray-200 rounded-xl outline-none min-h-[100px]"></textarea>
              </section>

              <div className="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10 md:relative md:bg-transparent md:border-t-0 md:shadow-none md:p-0">
                <div className="max-w-2xl mx-auto md:bg-white md:p-6 md:rounded-2xl md:border md:border-orange-100">
                  {submitError && <div className="mb-4 bg-red-50 text-red-600 p-3 rounded-xl border border-red-200 text-center font-medium text-sm">{submitError}</div>}
                  <div className="space-y-2 mb-4">
                    <div className="flex justify-between text-gray-600"><span>商品小計 ({orderSummary.totalBoxes}盒)</span><span>NT$ {orderSummary.subtotal.toLocaleString()}</span></div>
                    <div className="flex justify-between text-gray-600"><span>運費</span><span>NT$ {orderSummary.shippingFee.toLocaleString()}</span></div>
                    <div className="flex justify-between items-end border-t border-gray-100 pt-3 mt-3"><span className="font-bold text-gray-800 text-lg">總金額</span><span className="font-bold text-2xl text-orange-600">NT$ {orderSummary.total.toLocaleString()}</span></div>
                  </div>
                  <button type="submit" disabled={isSubmitting} className={`w-full text-white font-bold text-lg py-4 rounded-xl transition-all ${isSubmitting ? 'bg-gray-400' : 'bg-orange-500 hover:bg-orange-600'}`}>{isSubmitting ? '訂單處理中...' : '確認送出訂單'}</button>
                </div>
              </div>
            </form>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<OrderForm />);
  </script>
</body>
</html>
